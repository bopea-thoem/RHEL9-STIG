- name: Install auditd
  package:
    name: audit
    state: present

- name: Configure auditd backlog limit
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^num_logs'
    line: 'num_logs = 5'

- name: Configure auditd max log file
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file'
    line: 'max_log_file = 8'

- name: Configure auditd max log file action
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^max_log_file_action'
    line: 'max_log_file_action = keep_logs'

- name: Configure auditd space left action
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^space_left_action'
    line: 'space_left_action = email'

- name: Configure auditd admin space left action
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^admin_space_left_action'
    line: 'admin_space_left_action = halt'

- name: Configure auditd disk full action
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^disk_full_action'
    line: 'disk_full_action = halt'

- name: Configure auditd disk error action
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^disk_error_action'
    line: 'disk_error_action = halt'

- name: Deploy audit rules
  copy:
    dest: /etc/audit/rules.d/stig.rules
    content: |
      -w /etc/sudoers -p wa -k scope
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /var/log/lastlog -p wa -k logins
      -a always,exit -F arch=b64 -S execve -k exec
      -a always,exit -F arch=b32 -S execve -k exec
      -w /etc/sudoers.d -p wa -k scope
      -w /var/log/sudo.log -p wa -k actions
      -a always,exit -F arch=b64 -S sethostname -S setdomainname -k system-locale
      -a always,exit -F arch=b32 -S sethostname -S setdomainname -k system-locale
      -w /etc/issue -p wa -k system-locale
      -w /etc/issue.net -p wa -k system-locale
      -w /etc/hosts -p wa -k system-locale
      -w /etc/network -p wa -k system-locale
      -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S chown -S fchown -S fchownat -S lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S chown -S fchown -S fchownat -S lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
      -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts
      -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
      -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
      -a always,exit -F arch=b64 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S setxattr -S lsetxattr -S fsetxattr -S removexattr -S lremovexattr -S fremovexattr -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S chcon -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S chcon -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S setfacl -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S setfacl -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S chacl -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b32 -S chacl -F auid>=1000 -F auid!=4294967295 -k perm_mod
      -a always,exit -F arch=b64 -S usermod -F auid>=1000 -F auid!=4294967295 -k identity
      -a always,exit -F arch=b32 -S usermod -F auid>=1000 -F auid!=4294967295 -k identity
      -w /etc/group -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/security/opasswd -p wa -k identity
      -a always,exit -F arch=b64 -S init_module -S delete_module -k modules
      -a always,exit -F arch=b32 -S init_module -S delete_module -k modules
      -e 2

- name: Restart auditd
  service:
    name: auditd
    state: restarted
