- name: Install nftables
  package:
    name: nftables
    state: present

- name: Disable firewalld
  service:
    name: firewalld
    state: stopped
    enabled: no

- name: Configure nftables rules
  copy:
    dest: /etc/nftables.conf
    content: |
      table inet filter {
        chain input {
          type filter hook input priority 0;
          iif lo accept
          ct state established,related accept
          tcp dport 22 accept
          counter drop
        }
        chain forward {
          counter drop
        }
        chain output {
          accept
        }
      }

- name: Enable nftables
  service:
    name: nftables
    state: started
    enabled: yes
