---

- name: "MEDIUM | RHEL-09-211015 | PATCH | RHEL 9 vendor packaged system security patches and updates must be installed and up to date."
  when:
    - rhel_09_211015
    - not system_is_ec2
  notify: Change_requires_reboot
  tags:
    - RHEL-09-211015
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257778r991589_rule
    - V-257778
    - NIST800-53R4_CM-6b
  ansible.builtin.package:
    name: "*"
    state: latest

- name: "MEDIUM | RHEL-09-211020 | PATCH | RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user logon."
  when: rhel_09_211020
  tags:
    - RHEL-09-211020
    - CAT2
    - CCI-000048
    - CCI-001384
    - CCI-001385
    - CCI-001386
    - CCI-001387
    - CCI-001388
    - SRG-OS-000023-GPOS-00006
    - SRG-OS-000228-GPOS-00088
    - SV-257779r958390_rule
    - V-257779
    - NIST800-53R4_AC-8
  block:
    - name: "MEDIUM | RHEL-09-211020 | PATCH | RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user logon. | Uncomment banner keyword and set banner path"
      when: rhel9stig_sshd_required
      ansible.builtin.lineinfile:
        path: "{{ rhel9stig_sshd_config_file }}"
        regexp: (?i)^(#|)Banner
        line: "Banner {{ rhel9stig_sshd_config.banner_file }}"
      notify: Restart_sshd

    - name: "MEDIUM | RHEL-09-211020 | PATCH | RHEL 9 must display the Standard Mandatory DOD Notice and Consent Banner before granting local or remote access to the system via a command line user logon. | Set banner message"
      ansible.builtin.copy:  # noqa: template-instead-of-copy
        content: "{{ rhel9stig_logon_banner }}"
        dest: "{{ item }}"
        group: root
        mode: 'u-x,go-wx'
        owner: root
      loop:
        - "{{ rhel9stig_sshd_config.banner_file }}"
        - /etc/issue.net

- name: "MEDIUM | RHEL-09-211030 | PATCH | The graphical display manager must not be the default target on RHEL 9 unless approved."
  when:
    - rhel_09_211030
    - not rhel9stig_gui_approved
  tags:
    - RHEL-09-211030
    - CAT2
    - CCI-000366
    - SRG-OS-000480-GPOS-00227
    - SV-257781r991589_rule
    - V-257781
    - NIST800-53R4_CM-6
  ansible.builtin.file:
    src: /usr/lib/systemd/system/multi-user.target
    dest: /etc/systemd/system/default.target
    state: link

- name: "MEDIUM | RHEL-09-211040 | PATCH | RHEL 9 systemd-journald service must be enabled."
  when: rhel_09_211040
  tags:
    - RHEL-09-211040
    - CAT2
    - CCI-001665
    - SRG-OS-000269-GPOS-00103
    - SV-257783r991562_rule
    - V-257783
    - NIST800-53R4_SC-24
  notify: Systemd_daemon_reload
  ansible.builtin.systemd:
    name: systemd-journald
    enabled: true
    state: started

- name: "MEDIUM | RHEL-09-211055 | PATCH | RHEL 9 debug-shell systemd service must be disabled."
  when: rhel_09_211055
  tags:
    - RHEL-09-211055
    - CAT2
    - CCI-002235
    - SRG-OS-000324-GPOS-00125
    - SRG-OS-000480-GPOS-00227
    - SV-257786r1044834_rule
    - V-257786
    - NIST800-53R4_AC-6
  notify: Systemd_daemon_reload
  ansible.builtin.systemd:
    name: debug-shell.service
    enabled: false
    masked: true
    state: stopped

### Hardening: safe subset implementations

- name: "Ensure udf kernel module is blacklisted"
  ansible.builtin.copy:
    dest: /etc/modprobe.d/99-blacklist-udf.conf
    content: |
      # blocked by RHEL9-STIG
      blacklist udf
      install udf /bin/true
    owner: root
    group: root
    mode: '0644'

- name: "Ensure squashfs kernel module is blacklisted"
  ansible.builtin.copy:
    dest: /etc/modprobe.d/99-blacklist-squashfs.conf
    content: |
      # blocked by RHEL9-STIG
      blacklist squashfs
      install squashfs /bin/true
    owner: root
    group: root
    mode: '0644'

- name: "Ensure persistent network sysctl settings are present"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-rhel9-stig.conf
    content: |
      # RHEL9-STIG network hardening
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv6.conf.all.accept_ra = 0
      net.ipv6.conf.default.accept_ra = 0
    owner: root
    group: root
    mode: '0644'

- name: "Apply sysctl settings"
  ansible.builtin.command:
    cmd: sysctl --system
    warn: false

- name: "Ensure gpgcheck is enabled in /etc/yum.conf"
  ansible.builtin.lineinfile:
    path: /etc/yum.conf
    regexp: '^gpgcheck\s*='
    line: 'gpgcheck=1'
    create: true

- name: "Ensure gpgcheck is enabled in /etc/dnf/dnf.conf"
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: '^gpgcheck\s*='
    line: 'gpgcheck=1'
    create: true

- name: "Disable and mask bluetooth service"
  ansible.builtin.systemd:
    name: bluetooth.service
    enabled: false
    masked: true
    state: stopped

- name: "Ensure journald forwards logs to rsyslog"
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: '^#?ForwardToSyslog\s*='
    line: 'ForwardToSyslog=yes'
    create: true
  notify: restart-journald

- name: "Ensure rsyslog file creation mode is configured"
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\$FileCreateMode\s+'
    line: "$FileCreateMode 0640"
    create: true
  notify: restart-rsyslog
  


- name: "Ensure tmp is a separate partition"
  vars:
    warn_control_id: "MEDIUM | Ensure /tmp is separate"
  block:
     - name: "MEDIUM | Ensure /tmp is a separate filesystem | PASS"
       when: "'/tmp' in ansible_facts['mounts'] | map(attribute='mount') | list"
       ansible.builtin.debug:
         msg: "Congratulations /tmp is a separate filesystem"

     - name: "MEDIUM | Ensure /tmp is a separate filesystem | WARN"
       when: "'/tmp' not in ansible_facts['mounts'] | map(attribute='mount') | list"
       block:
         - name: "MEDIUM | Ensure /tmp is a separate filesystem | WARN MESSAGE"
           ansible.builtin.debug:
             msg: "Warning!! /tmp is not a separate filesystem"

         - name: "MEDIUM | Ensure /tmp is a separate filesystem | Warning facts"
           ansible.builtin.import_tasks:
             file: warning_facts.yml

